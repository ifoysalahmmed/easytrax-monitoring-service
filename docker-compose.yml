# Central monitoring stack (runs on the staging server).
# Grafana already runs there as grafana-server.service; only Prometheus and node_exporter are added here.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    network_mode: host   # reaches localhost:9100 and remote exporters; listens on :9090
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    network_mode: host   # listens on 127.0.0.1:9093 only
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
      - --cluster.listen-address=
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /srv/monitoring/secrets/telegram_token:/etc/alertmanager/secrets/telegram_token:ro
      - alertmanager-data:/alertmanager

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    network_mode: host   # :9100
    pid: host
    command: [--path.rootfs=/host]
    volumes:
      - /:/host:ro,rslave

volumes:
  prometheus-data:
  alertmanager-data:
