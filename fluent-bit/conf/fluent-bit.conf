[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/efollowr_alarm.log
    Parser            celery_log
    Tag               celery.alarm
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On

[FILTER]
    Name                parser
    Match               celery.*
    Key_Name            log
    Parser              celery_log
    Reserve_Data        On
    Preserve_Key        On

[OUTPUT]
    Name                es
    Match               *
    Host                72.60.98.158
    Port                9201
    Logstash_Format     On
    Logstash_Prefix     fluent-bit
    Suppress_Type_Name  On

