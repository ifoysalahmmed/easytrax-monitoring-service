[PARSER]
    Name        celery_log
    Format      regex
    Regex       ^\[(?<timestamp>[^\]]+)\: (?<level>[A-Z]+)\/(?<worker>[^\]]+)\] (?<message>.*)$
    Time_Key    timestamp
    Time_Format %Y-%m-%d %H:%M:%S,%L
    Time_Keep   On

[PARSER]
    Name        celery_json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   On
