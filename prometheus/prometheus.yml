global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Celery queue lengths, exported next to the prod Redis
  - job_name: parser_worker
    static_configs:
      - targets: ["160.191.150.118:9808"]

  - job_name: postgres
    static_configs:
      - targets: ["182.48.91.234:9187"]
        labels:
          alias: postgres
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: postgres

  # Server resource usage (node_exporter, port 9100). Add a host here once it runs node_exporter.
  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]
        labels: { host: staging }
      - targets: ["182.48.91.234:9100"]
        labels: { host: database }
