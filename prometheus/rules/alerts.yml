groups:
  - name: easytrax
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        annotations:
          summary: "{{ $labels.job }} {{ $labels.instance }} is down"
      - alert: CeleryQueueBacklog
        expr: celery_queue_length > 5000
        for: 10m
        annotations:
          summary: "Queue {{ $labels.queue_name }} has {{ $value }} tasks waiting"
      - alert: DiskAlmostFull
        expr: 100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes * 100) > 85
        for: 10m
        annotations:
          summary: "{{ $labels.host }} {{ $labels.mountpoint }} is {{ $value | printf \"%.0f\" }}% full"
      - alert: HighMemoryUse
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        annotations:
          summary: "{{ $labels.host }} memory at {{ $value | printf \"%.0f\" }}%"
