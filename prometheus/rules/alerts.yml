groups:
  - name: easytrax
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        annotations:
          summary: "{{ $labels.job }} {{ $labels.instance }} is down"
      - alert: CeleryQueueBacklog
        expr: celery_queue_length > 5000
        for: 10m
        annotations:
          summary: "Queue {{ $labels.queue_name }} has {{ $value }} tasks waiting"
      - alert: DiskAlmostFull
        expr: 100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes * 100) > 85
        for: 10m
        annotations:
          summary: "{{ $labels.host }} {{ $labels.mountpoint }} is {{ $value | printf \"%.0f\" }}% full"
      - alert: HighMemoryUse
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        annotations:
          summary: "{{ $labels.host }} memory at {{ $value | printf \"%.0f\" }}%"
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        annotations:
          summary: "PostgreSQL is down (exporter cannot reach it)"
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) * 100 > 80
        for: 10m
        annotations:
          summary: "PostgreSQL connections at {{ $value | printf \"%.0f\" }}% of max_connections"
      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks[15m]) > 0
        annotations:
          summary: "PostgreSQL deadlocks detected in {{ $labels.datname }}"
      - alert: ElasticsearchDown
        expr: elasticsearch_clusterinfo_up == 0
        for: 2m
        annotations:
          summary: "Elasticsearch exporter cannot reach the cluster"
      - alert: ElasticsearchClusterRed
        expr: elasticsearch_cluster_health_status{color="red"} == 1
        for: 2m
        annotations:
          summary: "Elasticsearch cluster {{ $labels.cluster }} is RED"
      - alert: ElasticsearchUnassignedShards
        expr: elasticsearch_cluster_health_unassigned_shards > 0
        for: 15m
        annotations:
          summary: "Elasticsearch has {{ $value }} unassigned shards"
      - alert: ElasticsearchHeapHigh
        expr: elasticsearch_jvm_memory_used_bytes{area="heap"} / elasticsearch_jvm_memory_max_bytes{area="heap"} * 100 > 90
        for: 10m
        annotations:
          summary: "Elasticsearch JVM heap at {{ $value | printf \"%.0f\" }}%"
